<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My EP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/base.css?v=20260922-5">
</head>
<body>
<div class="crt-overlay"><div class="crt-scanlines"></div><div class="crt-flicker"></div><div class="crt-glow"></div><div class="crt-vignette"></div></div>
<div id="ep133-browser" class="ep133-browser independent-app" aria-hidden="false">
<div class="ep133-browser-window my-ep-window" role="dialog" aria-modal="false" aria-labelledby="ep133-browser-title">
<div class="title-bar"><span id="ep133-browser-title">MY EP</span><button id="ep133-close" type="button" aria-label="Close">×</button></div>
<div class="ep133-browser-body"><div class="ep133-device-head"><div><strong id="ep133-device">NO DEVICE</strong><span id="ep133-status">NOT CONNECTED</span></div><div class="ep133-actions"><button id="ep133-connect" type="button">CONNECT</button><button id="ep133-refresh" type="button" disabled>REFRESH</button></div></div>
<div class="ep133-readonly">SAMPLE MEMORY · 999 SLOTS</div><div class="ep133-sample-memory"><div class="ep133-sample-header"><div><strong>SAMPLE MEMORY</strong><span>999 POSITIONS</span></div><input id="ep133-sample-search" type="search" placeholder="Search slot or name" aria-label="Search sample slots"></div>
<div id="ep133-sample-tabs" class="ep133-sample-tabs" aria-label="Sample groups"></div><div class="ep133-sample-list" id="ep133-sample-list"><div class="ep133-empty">Connect a device to read its sample memory.</div></div><div id="ep133-sample-info" class="ep133-info"><div class="ep133-info-empty">Select a sample slot.</div></div></div>
<div class="ep133-safety">Drop an audio file onto a slot to write it to that EP position. Click a sample to preview it on the device.</div></div></div></div>
<div id="error-dialog" role="alertdialog" aria-modal="true" style="display:none"><div class="error-dialog-window"><div class="title-bar"><span>Warning</span><button id="error-close" type="button" aria-label="Close">×</button></div><div class="error-dialog-body"><div class="error-dialog-message"><span class="error-icon">!</span><span id="error-message"></span></div><button id="error-ok" type="button">OK</button></div></div></div>
<script type="module" src="js/my-ep.js?v=20260922-1"></script>
</body></html>
