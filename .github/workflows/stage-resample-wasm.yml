name: stage production resample wasm

on:
  push:
    branches:
      - fix/ep-debug-preflight-resample-20260929

permissions:
  contents: write

jobs:
  stage:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: stage production resample fetch') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ep-debug-preflight-resample-20260929
          fetch-depth: 0
      - name: Fetch and verify official TE resample module
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://teenage.engineering/apps/ep-sample-tool/assets/resample-BWif2rvd.wasm \
            --output /tmp/resample.wasm
          test "$(stat -c%s /tmp/resample.wasm)" = "214055"
          echo "013809682a99d529ac363d0d186a709f31dceb762cffb9c1e270fc7b04e2f32e  /tmp/resample.wasm" | sha256sum -c -
          cp /tmp/resample.wasm js/ep133/wasm/resample.wasm
      - name: Commit verified binary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ep133/wasm/resample.wasm
          if git diff --cached --quiet; then
            echo "Binary already matches production."
            exit 0
          fi
          git commit -m "fix: update production TE resample wasm"
          git push origin HEAD:fix/ep-debug-preflight-resample-20260929
