name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Keep only the newest run for each PR. Never cancel main push checks or
# unrelated workflows (including the separately approved Pages deployment).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codex-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-codex-env.mjs

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build-pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:pages
      - run: npm run verify:pages

  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci uses the committed, exact-version lockfile.
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Test the actual versioned production dist under /Ko-tool/, not only source files.
      - run: npm run build:pages
      - run: npm run verify:pages
      - run: npm run test:pages:e2e
      # The CI suite uses fake EP and generated fixtures only. Keep traces
      # from failures briefly for reproducible diagnostics; never upload HIL captures.
      - name: Upload failed Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
