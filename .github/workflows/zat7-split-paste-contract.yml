name: zat7-split-paste-contract
on:
  push:
    branches:
      - feat/zat-7-composition-cleanup
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/zat7-split-paste-contract.mjs
      - run: git rm .github/scripts/zat7-split-paste-contract.mjs .github/workflows/zat7-split-paste-contract.yml
      - name: Commit migrated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ep133.test.mjs
          git commit -m "test: split EP paste entry and workspace contracts"
          git push origin HEAD:feat/zat-7-composition-cleanup
