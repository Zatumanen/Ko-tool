name: zat7-migrate-source-contracts
on:
  push:
    branches:
      - feat/zat-7-composition-cleanup
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate source-contract tests
        run: node .github/scripts/zat7-migrate-source-contracts.mjs
      - name: Remove one-shot migration helpers
        run: git rm .github/scripts/zat7-migrate-source-contracts.mjs .github/workflows/zat7-migrate-source-contracts.yml
      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ep133.test.mjs
          git commit -m "test: retarget EP source contracts to workspace composition"
          git push origin HEAD:feat/zat-7-composition-cleanup
