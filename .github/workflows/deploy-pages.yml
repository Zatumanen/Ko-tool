name: deploy-pages

# Explicit owner-approved action only. Never auto-publish on a merge to main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Codex environment
        run: node scripts/check-codex-env.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit and behavior tests
        run: npm test

      - name: Build GitHub Pages
        run: npm run build:pages

      - name: Validate versioned Pages artifact
        run: npm run verify:pages

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E with fake EP
        run: npm run test:e2e

      - name: Browser E2E on versioned /Ko-tool/ dist
        run: npm run test:pages:e2e

      - name: Upload exact tested dist for deploy
        uses: actions/upload-artifact@v4
        with:
          name: verified-pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verified SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download exact tested dist
        uses: actions/download-artifact@v4
        with:
          name: verified-pages-dist
          path: dist

      - name: Verify artifact SHA again
        run: npm run verify:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
